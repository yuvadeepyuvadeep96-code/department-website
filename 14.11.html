
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Manager</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce7f3, #ddd6fe);

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            max-width: 95%;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(88, 28, 135, 0.18);
        }

        h1 {
            text-align: center;
            color: #7e22ce;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d8b4fe;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
        }

        input:focus {
            border-color: #9333ea;
        }

        .add-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background-color: #9333ea;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .add-btn:hover {
            background-color: #7e22ce;
        }

        #list {
            margin-top: 20px;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background-color: #faf5ff;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 5px solid #a855f7;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.07);
        }

        .task h3 {
            margin: 0;
            color: #581c87;
            flex: 1;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .buttons {
            display: flex;
            gap: 6px;
        }

        .complete-btn,
        .delete-btn {
            border: none;
            padding: 8px 10px;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
        }

        .complete-btn {
            background-color: #059669;
        }

        .complete-btn:hover {
            background-color: #047857;
        }

        .delete-btn {
            background-color: #f43f5e;
        }

        .delete-btn:hover {
            background-color: #e11d48;
        }

        .completed {
            text-decoration: line-through;
            color: #059669 !important;
            opacity: 0.7;
        }

        @media (max-width: 400px) {
            .container {
                padding: 20px;
            }

            .task {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Task Manager</h1>

        <div class="input-section">

            <input
                type="text"
                placeholder="Enter your task"
                id="input">

            <button class="add-btn" onclick="Massage()">
                Add Task
            </button>

        </div>

        <h1>Task List</h1>

        <div id="list"></div>

    </div>

    <script>

        function Massage() {

            let taskName = document.getElementById("input").value.trim();

            if (taskName === "") {
                alert("Please Enter Task");
                return;
            }

            let task = document.createElement("div");
            task.className = "task";

            let heading = document.createElement("h3");
            heading.textContent = taskName;

            let buttons = document.createElement("div");
            buttons.className = "buttons";

            let complete = document.createElement("button");
            complete.className = "complete-btn";
            complete.innerText = "Complete";
            complete.onclick = function() {
                heading.classList.add("completed");
                complete.innerText = "Completed";
                complete.disabled = true;
                complete.style.opacity = "0.6";
            };

            let remove = document.createElement("button");
            remove.className = "delete-btn";
            remove.innerText = "Delete";
            remove.onclick = function() {
                task.remove();
            };

            buttons.appendChild(complete);
            buttons.appendChild(remove);

            task.appendChild(heading);
            task.appendChild(buttons);

            document.getElementById("list").appendChild(task);

            document.getElementById("input").value = "";
        }

    </script>

</body>
</html>
